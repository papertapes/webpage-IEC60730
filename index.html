<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEC 60730 × RA2E1 交互式学习课程</title>
<style>
/* IEC60730-RA2E1 课程样式 · 深色默认 + 浅色可切换 · 强调色 #009A9D */
:root{
  --bg:#14171c; --panel:#1c2129; --panel2:#222833; --line:#2e3644;
  --txt:#d7dde6; --sub:#8b96a5; --accent:#009A9D; --accent-l:#3fd0d3;
  --ok:#4caf7d; --warn:#e0a83c; --bad:#e06c5c;
  --s:#5b8dd9; --r:#009A9D; --e:#e0a83c; --todo:#7a8494;
  --chip:#2a3441; --code-bg:#101318;
}
body.light{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f4; --line:#d8dee6;
  --txt:#242a33; --sub:#5d6a7a; --accent-l:#007a7d;
  --chip:#e3e9ef; --code-bg:#1c2129;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;line-height:1.75;}
a{color:var(--accent-l);text-decoration:none;}
/* 顶部导航 */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:100;}
#topbar .logo{font-weight:700;color:#fff;font-size:15px;white-space:nowrap;}
#topbar .logo b{color:var(--accent-l);}
#searchBox{flex:1;max-width:420px;background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:6px 12px;color:var(--txt);font-size:13px;outline:none;}
#searchBox:focus{border-color:var(--accent);}
#unitTitle{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.tbtn{background:var(--chip);border:1px solid var(--line);color:var(--sub);border-radius:7px;padding:5px 12px;cursor:pointer;font-size:12.5px;white-space:nowrap;}
.tbtn:hover{color:var(--txt);border-color:var(--accent);}
#progressMini{font-size:12px;color:var(--sub);white-space:nowrap;}
#progressMini b{color:var(--accent-l);}
/* 布局 */
#layout{display:flex;padding-top:52px;min-height:100vh;}
#sidebar{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);height:calc(100vh - 52px);overflow-y:auto;padding:12px 0;position:sticky;top:52px;}
.stage-l{padding:12px 16px 4px;font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:1px;}
.nav-u{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--txt);border-left:3px solid transparent;}
.nav-u:hover{background:var(--panel2);}
.nav-u.active{background:var(--panel2);border-left-color:var(--accent);color:var(--accent-l);font-weight:600;}
.nav-u .no{width:26px;height:22px;border-radius:6px;background:var(--chip);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0;}
.nav-u.done .no{background:rgba(76,175,125,.2);color:var(--ok);}
#main{flex:1;min-width:0;padding:28px 36px 80px;max-width:920px;}
/* 章节结构 */
h1.ch{font-size:22px;color:#fff;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px;}
body.light h1.ch{color:var(--txt);}
h1.ch .no{color:var(--accent-l);}
.ch-lead{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:16px 0;}
.ch-lead h4{color:var(--accent-l);font-size:13px;margin-bottom:6px;}
h2.sec{font-size:17px;color:var(--accent-l);margin:30px 0 12px;padding-left:10px;border-left:4px solid var(--accent);}
h3{font-size:14.5px;color:var(--txt);margin:16px 0 8px;}
p{margin:8px 0;color:var(--txt);}
p.dim{color:var(--sub);font-size:13px;}
ul,ol{margin:8px 0 8px 22px;}
li{margin:4px 0;}
li b{color:#fff;}
body.light li b{color:var(--txt);}
strong{color:#fff;}
body.light strong{color:var(--txt);}
/* 知识点卡片 */
.kp{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden;}
.kp-h{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;}
.kp-h:hover{background:var(--panel2);}
.kp-h .t{flex:1;font-weight:600;font-size:14px;color:#fff;}
body.light .kp-h .t{color:var(--txt);}
.kp-h .arr{color:var(--sub);transition:transform .25s;}
.kp.open .kp-h .arr{transform:rotate(90deg);}
.kp-b{max-height:0;overflow:hidden;transition:max-height .4s;padding:0 16px;}
.kp.open .kp-b{max-height:2600px;padding:4px 16px 14px;border-top:1px solid var(--line);}
.kp-b .def{font-size:13.5px;color:var(--accent-l);margin:8px 0;font-weight:600;}
/* 来源标签 */
.tag{display:inline-flex;align-items:center;font-size:10.5px;padding:1px 8px;border-radius:9px;cursor:pointer;border:1px solid;white-space:nowrap;vertical-align:1px;}
.tag-S{color:var(--s);border-color:rgba(91,141,217,.5);background:rgba(91,141,217,.1);}
.tag-R{color:var(--accent-l);border-color:rgba(0,154,157,.5);background:rgba(0,154,157,.1);}
.tag-E{color:var(--warn);border-color:rgba(224,168,60,.5);background:rgba(224,168,60,.1);}
.tag-T{color:var(--todo);border-color:rgba(122,132,148,.5);background:rgba(122,132,148,.12);}
/* 已理解勾选 */
.ckm{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);cursor:pointer;flex-shrink:0;}
.ckm input{accent-color:var(--ok);}
.ckm.done{color:var(--ok);}
/* 图 */
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;text-align:center;}
.fig svg{max-width:100%;height:auto;}
.fig .cap{font-size:12px;color:var(--sub);margin-top:8px;}
/* 代码 */
.codebox{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:9px;margin:12px 0;overflow:hidden;}
.codebox .chd{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);}
.codebox .chd .src{font-family:Consolas,monospace;}
.codebox pre{padding:12px 16px;overflow-x:auto;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.6;color:#b9c6d6;}
.codebox .cp{background:var(--chip);border:1px solid var(--line);color:var(--sub);border-radius:5px;padding:2px 10px;cursor:pointer;font-size:11px;}
.codebox .cp:hover{color:var(--accent-l);}
pre .k{color:#6cb6ff;}pre .c{color:#6a7a8c;font-style:italic;}pre .s{color:#8fd0a0;}pre .n{color:#e0a83c;}pre .f{color:#3fd0d3;}
/* 模拟器 */
.sim{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px;margin:16px 0;}
.sim h4{color:var(--accent-l);font-size:14px;margin-bottom:4px;}
.sim .snote{font-size:11.5px;color:var(--warn);margin-bottom:10px;}
.sim .ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.sim button{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 16px;cursor:pointer;font-size:13px;}
.sim button.ghost{background:var(--chip);border:1px solid var(--line);color:var(--sub);}
.sim button:hover{opacity:.9;}
.sim select,.sim input[type=range]{accent-color:var(--accent);}
.sim select{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 10px;}
.sim .disp{background:var(--code-bg);border-radius:8px;padding:10px 14px;font-family:Consolas,monospace;font-size:13px;margin:10px 0;min-height:40px;white-space:pre-wrap;color:#b9c6d6;}
.sim .bad{color:var(--bad)!important;}.sim .good{color:var(--ok)!important;}.sim .warnc{color:var(--warn)!important;}
.cellbox{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin:10px 0;}
.cell{height:22px;border-radius:3px;background:var(--chip);font-size:8.5px;display:flex;align-items:center;justify-content:center;color:var(--sub);}
.cell.c0{background:#26354a;color:#8fb8d8;}
.cell.c1{background:#1f4a3a;color:#8fd0a0;}
.cell.cur{outline:2px solid var(--accent);}
/* 测验 */
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0;}
.quiz h4{color:var(--accent-l);font-size:14px;margin-bottom:10px;}
.q{margin:14px 0;padding-bottom:12px;border-bottom:1px dashed var(--line);}
.q .qt{font-weight:600;margin-bottom:8px;font-size:13.5px;}
.q .opt{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px 13px;margin:5px 0;cursor:pointer;font-size:13px;font-family:inherit;}
.q .opt:hover{border-color:var(--accent);}
.q .opt.right{border-color:var(--ok);color:var(--ok);}
.q .opt.wrong{border-color:var(--bad);color:var(--bad);}
.q .exp{display:none;font-size:12.5px;color:var(--sub);background:rgba(0,154,157,.06);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:8px;}
.q .exp.show{display:block;}
/* 术语弹窗 */
#glossPop{position:fixed;display:none;max-width:380px;background:var(--panel2);border:1px solid var(--accent);border-radius:9px;padding:12px 15px;font-size:13px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);}
#glossPop b{color:var(--accent-l);}
.term{border-bottom:1px dashed var(--accent-l);cursor:pointer;color:var(--accent-l);}
/* 总结 */
.summary{background:rgba(76,175,125,.06);border:1px solid rgba(76,175,125,.4);border-radius:10px;padding:14px 18px;margin:16px 0;}
.summary h4{color:var(--ok);font-size:14px;margin-bottom:8px;}
.nextch{color:var(--sub);font-size:12.5px;margin-top:8px;}
/* 搜索结果 */
#searchRes{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-height:60vh;overflow-y:auto;background:var(--panel2);border:1px solid var(--accent);border-radius:10px;z-index:150;display:none;box-shadow:0 10px 40px rgba(0,0,0,.5);}
#searchRes .sr{padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;}
#searchRes .sr:hover{background:var(--chip);}
#searchRes .sr .t{color:#fff;font-weight:600;}
#searchRes .sr .p{color:var(--sub);font-size:11.5px;}
/* 来源卡 */
#srcPop{position:fixed;display:none;width:min(400px,92vw);background:var(--panel2);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;font-size:12.5px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);}
#srcPop h5{color:var(--accent-l);font-size:13px;margin-bottom:8px;}
#srcPop dl{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;}
#srcPop dt{color:var(--sub);}#srcPop dd{color:var(--txt);word-break:break-all;}
/* 底部进度 */
#progressBar{position:fixed;bottom:0;left:0;right:0;height:6px;background:var(--chip);z-index:100;}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-l));transition:width .3s;}
@media(max-width:900px){#sidebar{display:none;}#main{padding:20px 18px 60px;}}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--chip);border-radius:5px;}

</style>
</head>
<body>
<nav id="topbar">
  <span class="logo">IEC 60730 <b>×</b> RA2E1</span>
  <input id="searchBox" placeholder="搜索章节 / 概念 / 术语…">
  <span id="unitTitle"></span>
  <span id="progressMini"></span>
  <button class="tbtn" id="themeBtn">☀️ 浅色</button>
</nav>
<div id="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<div id="searchRes"></div>
<div id="glossPop"></div>
<div id="srcPop"></div>
<div id="progressBar"><div id="progressFill"></div></div>

<!-- 课程数据（以 .js 内嵌，保证 file:// 双击直开） -->
<script>
/* 课程数据 · 阶段一：标准基础（第01-04章） */
window.CHP = window.CHP || {};
Object.assign(window.CHP, {

ch01: {
  id:'ch01', no:'01', stage:1, title:'认识 IEC 60730',
  lead:{
    goal:'搞清楚 IEC 60730 是什么标准、管什么产品、和你写的固件有什么关系。',
    why:'你将要为一个家电 MCU 固件集成安全自检——第一步是知道"为什么标准要求这些测试"。',
    pre:'无。零基础可学。',
    rel:'本章是全部后续章节的地基：第 3 章的术语、第 4 章的 Class 分级都从这里延伸。'
  },
  concepts:[
    {t:'IEC 60730 系列标准的定位', tag:'S', src:'S-STD-DEF',
     def:'IEC 60730 系列是针对"家用和类似用途的自动电气控制器"的安全标准。',
     body:`<p>今天，自动电子控制系统不断扩展到各种应用中，系统的可靠性与安全性成为设计中的关键因素。IEC 60730 正是为这类<b>自动电子控制器</b>（Automatic Electrical Controls）制定的安全标准。</p>
     <p>标准的对象不是整机（整机另有 IEC 60335 系列管），而是整机里面的那个"控制大脑"——你正在写固件的 MCU 控制器。两者通过引用互相衔接。</p>
     <p><strong>与你最相关的部分</strong>：附录 H（Annex H）——专门规定使用软件的电子控制系统的要求，是嵌入式软件工程师阅读整个标准的入口。</p>`},
    {t:'为什么家电软件需要安全标准', tag:'S', src:'S-STD-WHY',
     def:'软件承担的控制一旦失效，可能造成设备不安全运行，标准要求通过设计与验证把这种风险控制在可接受范围。',
     body:`<p>机电时代的控制器，失效模式是物理的（触点粘连、弹簧疲劳），人们积累了成熟的应对经验。MCU 普及后，一个位翻转就可能让程序跑飞——加热器不停机、门锁不落位。</p>
     <p>标准应对的思路不是"让软件不出错"（做不到），而是：<strong>持续检测硬件与软件的失效，检测到后让系统进入安全状态</strong>。这就是贯穿全课程的闭环。</p>`},
    {t:'IEC 60730 与 IEC 60335 的关系', tag:'R', src:'R-AN-NOTE1',
     def:'60730 管控制器，60335 管整机；整机标准通过附录 R 引用 60730 对电子控制的要求。',
     body:`<p>瑞萨应用笔记 R01AN5540EJ0101 的 Note 1 原文声明：该库的认证依据是欧洲标准 <b>EN 60335-1:2002/A1:2004 Annex R</b>，而 Annex R 只有孤零零一页——它把定义、信息和适用条款全部跳转到 IEC 60730-1。</p>
     <p><span class="tag tag-T" data-src="T-CERT-CHAIN">待核实</span> 注意版本链：该声明引用的是 EN 60730-1:2000（2000 版），而 VDE 检测报告（2022 年）采用的已是 EN 60730-1:2016+A1:2019。你本地持有的正式文本是 <b>IEC 60730-1:2022</b>。认证所依据的版本与最新版本不一致，是真实工程中常见的版本管理课题。</p>`},
    {t:'常见误解澄清', tag:'E', src:'E-CH01-MIS',
     def:'五个最容易搞错的概念，先纠正再往下学。',
     body:`<ul>
     <li><b>误解一："用了认证过的自检库，产品就合规了。"</b> 错。库只是积木，集成的参数（CRC 范围、时钟常数、测试调度）和故障响应由你定义并自证。</li>
     <li><b>误解二："芯片有硬件自检功能 = 满足标准。"</b> 硬件能力、厂商软件库、库的评估报告、应用的合规、整机的认证，是<b>五个不同层级</b>的结论，不能互相替代。</li>
     <li><b>误解三："测试报告 = 认证证书。"</b> 你手头的 VDE 文件是 Prüfbericht（检测报告），报告首页明确写明"该报告不授权使用 VDE 认证标志"。<span class="tag tag-R" data-src="R-VDE-SCOPE">R｜VDE 检测报告</span></li>
     <li><b>误解四："MCU 自检库测的是我的应用逻辑。"</b> 库只测 MCU 硬件层（CPU/RAM/Flash/时钟…），应用逻辑安全要靠你的设计。</li>
     <li><b>误解五："60730-1 一本标准就够了。"</b> Part 1 是通用要求，具体产品（如洗衣机的水位控制、门锁）还可能涉及 Part 2 专项标准。<span class="tag tag-T" data-src="T-PART2">待核实</span></li></ul>`}
  ],
  figs:['fig-closure'],
  figcaps:{'fig-closure':'图 1-1 · IEC 60730 的核心闭环：正常运行 ⇄ 故障检测 → 进入安全状态'},
  sim:null,
  quiz:[
    {q:'IEC 60730 标准的直接对象是什么？', opts:['家用电器整机','家用和类似用途的自动电气控制器','所有工业控制器','电源适配器'], a:1,
     exp:'60730 管的是"自动电气控制器"（如家电中的电子控制单元），整机安全由 IEC 60335 系列管辖，两者互相引用衔接。', src:'S-STD-DEF'},
    {q:'嵌入式软件工程师阅读 IEC 60730-1 时，最核心的附录是？', opts:['Annex A','Annex D','Annex H','Annex Z'], a:2,
     exp:'Annex H 专门规定使用软件的电子控制系统的要求（软件分级、自检表 H.11.12.1 等），是固件工程师的主战场。', src:'S-STD-DEF'},
    {q:'判断题：VDE 出具的检测报告（Prüfbericht）等同于产品认证证书。', opts:['正确','错误'], a:1,
     exp:'报告首页明确写明"该报告不授权使用 VDE 认证标志（Certification Mark）"，它只是一次单独调查的结果文件。检测报告、认证证书、认证标志是不同层级的文件。', src:'R-VDE-SCOPE'},
    {q:'以下哪个结论层级与其他四个不同？', opts:['MCU 具备硬件 CRC 外设','厂商提供自检软件库','该软件库通过了 VDE 评估','我的应用代码逻辑正确'], a:3,
     exp:'前三项都是"厂商/机构侧"的结论，而"我的应用逻辑正确"是应用开发者必须自己设计并验证的——库不能替你证明应用逻辑正确。', src:'E-CH01-MIS'}
  ],
  summary:['IEC 60730 管"自动电气控制器"，整机由 60335 管，Annex H 是软件要求核心','核心闭环：故障检测 → 故障响应（进入安全状态）','库/芯片/报告/应用/整机是五个层级的结论，不可互相替代','你手头的正式文本是 IEC 60730-1:2022（扫描版）；VDE 检测报告基于 60730-1:2013+AMD 系列'],
  next:'下一章：IEC 60730 标准结构 —— Part 1 / Part 2 / Annex H 各管什么。'
},

ch02: {
  id:'ch02', no:'02', stage:1, title:'IEC 60730 标准结构',
  lead:{
    goal:'理解 Part 1 / Part 2 / Annex H 的分工，能在标准树里找到自己该读的部分。',
    why:'后面所有章节引用的条款（如 H.11.12.1）都挂在这棵标准树上，找不到树就找不到据。',
    pre:'第 01 章。',
    rel:'为第 04 章 Class 分级和第 13 章需求追踪提供"条款坐标系"。'
  },
  concepts:[
    {t:'Part 1：通用要求', tag:'S', src:'S-PART1',
     def:'IEC 60730-1 是全系列的通用基础，包含通用要求、试验通用程序，以及附录 H 等特殊附录。',
     body:`<p>Part 1 规定所有自动电气控制器共同满足的要求：定义、分类、标记、防触电、结构、电气强度……其中对嵌入式软件工程师最重要的是 <b>Annex H</b>（使用软件的电子控制系统的要求）。</p>
     <p>你本地持有的文本：<b>IEC 60730-1:2022（Ed 5.0，610 页，扫描版）</b>。课程引用条款号时均指 2022 版；因 PDF 为扫描图像、无机读文本，页码级引用标注"以 PDF 页码为准"。<span class="tag tag-T" data-src="T-SCAN">待核实</span></p>`},
    {t:'Part 2 系列：产品专项要求', tag:'S', src:'S-PART2',
     def:'Part 2-x 针对具体类型的控制装置给出特殊要求，与 Part 1 配合使用。',
     body:`<p>洗衣机控制器可能涉及的 Part 2 方向（<span class="tag tag-T" data-src="T-PART2">待核实：具体适用以标准文本与认证机构意见为准</span>）：</p>
     <ul><li><b>IEC 60730-2-6</b>：压力/水位传感控制（洗衣机的进水水位）</li>
     <li><b>IEC 60730-2-7</b>：定时器与时序开关</li>
     <li><b>IEC 60730-2-9</b>：温度传感控制（水温）——家电行业应用最广</li>
     <li><b>IEC 60730-2-12</b>：门锁（洗衣机安全联锁）</li></ul>
     <p>课程主线（Class B 自检机制）在 Part 1 Annex H 层面展开；Part 2 只需知道"存在且有引用关系"，具体条款在整机认证阶段再深入。</p>`},
    {t:'Annex H 的内部结构', tag:'R', src:'R-AN-TABLE1',
     def:'Annex H 规定软件分级（H.2 Class A/B/C）与各软件类别的具体要求，其中表 H.11.12.1 列出 Class B 要求的测试项目——正是自检库实现的那十项。',
     body:`<p>对本课程最关键的三块：</p>
     <ul><li><b>H.2 术语与分级</b>：Class A/B/C 的正式定义（第 4 章展开）</li>
     <li><b>H.11 通用要求</b>：软件设计、自检、诊断覆盖的一般条款</li>
     <li><b>表 H.11.12.1</b>：Class B 软件要求测试的组件/项清单——CPU、ROM、RAM、时钟、看门狗、电压、ADC、温度、输出（POE）、GPIO——瑞萨自检库的十项与之一一对应<span class="tag tag-R" data-src="R-AN-TABLE1">R｜应用笔记 Table 1</span></li></ul>
     <p><span class="tag tag-T" data-src="T-HCL">待核实</span> H.11.12.1 的确切条款文字需在 2022 版扫描件中人工核对（本课程基于库实现反推的对应关系，属 R 类证据）。</p>`},
    {t:'版本管理与"现行版"陷阱', tag:'E', src:'E-CH02-VER',
     def:'认证依据的版本 ≠ 最新版本 ≠ 你在用的版本。三个版本要分开管理。',
     body:`<p>本项目的真实版本矩阵（全部已核实）：</p>
     <table><tr><th>文档</th><th>版本</th><th>日期</th></tr>
     <tr><td>IEC 60730-1 正式文本</td><td>2022 版（Ed 5.0）</td><td>2022</td></tr>
     <tr><td>VDE 检测报告依据</td><td>EN 60730-1:2016+A1:2019 / IEC 60730-1:2013+AMD1:2015+AMD2:2020</td><td>2022-06-22 出具</td></tr>
     <tr><td>瑞萨自检库应用笔记</td><td>R01AN5540EJ0101 Rev.1.01</td><td>2024-05-31</td></tr>
     <tr><td>RA2E1 数据手册</td><td>R01DS0386EJ0170 Rev.1.70</td><td>2025-10-31</td></tr></table>
     <p>结论：库认证所依据的标准版本（2013+AMD，等效采用 2016 欧标）<b>落后于</b>你手头的 2022 版。做新产品认证时，机构会按现行有效版本要求你，可能产生差距分析——这就是"版本管理是安全工程的日常"。</p>`}
  ],
  figs:['fig-stdtree'],
  figcaps:{'fig-stdtree':'图 2-1 · IEC 60730 标准树：Part 1 通用 + Part 2 专项 + Annex H 软件要求'},
  sim:null,
  quiz:[
    {q:'洗衣机电子控制器在标准树中"最可能"同时涉及哪些 Part 2？', opts:['2-6 水位、2-9 温度、2-12 门锁','只有 2-9','只有整机标准 60335-2-7','Part 2 与控制器无关'], a:0,
     exp:'洗衣机的进水水位（2-6 压力/水位传感）、水温（2-9 温度传感）、安全联锁（2-12 门锁）都是典型的自动电气控制。但具体适用清单必须以标准文本核实——本题选项基于常识映射，正式判定需查原文并咨询认证机构。', src:'T-PART2'},
    {q:'VDE 检测报告评估瑞萨自检库所依据的 IEC 60730-1 版本是？', opts:['2022 版','2016+A1:2019（欧标）/ IEC 2013+AMD1+AMD2','2000 版','2010 版'], a:1,
     exp:'证书列明：EN 60730-1:2016+A1:2019 与 IEC 60730-1:2013+AMD1:2015+AMD2:2020。而 2000 版是应用笔记 Note 1 引用的旧版本链，2022 版是你手里的最新文本。三个版本三种用途，不可混淆。', src:'R-VDE-STDS'},
    {q:'判断题：表 H.11.12.1 的测试项与瑞萨自检库的十项一一对应，所以库实现 = 条款原文。', opts:['正确','错误'], a:1,
     exp:'库的十项确实是按 H.11.12.1 设计的（应用笔记明示对应关系），但"库实现了这些测试"与"条款原文如此规定"是两种证据：前者是 R 类（厂商实现），后者是 S 类（标准要求）。本课程因标准为扫描版，S 类对应关系还需人工核对原文。', src:'R-AN-TABLE1'}
  ],
  summary:['Part 1 通用 + Part 2 专项 + Annex H 软件要求','表 H.11.12.1 = Class B 测试项清单 = 自检库十项的源头','版本矩阵：2022 文本 / 2013+AMD 认证依据 / 2000 转述链——分开放、别混淆'],
  next:'下一章：安全概念与基本术语 —— 故障、失效、诊断、安全状态。'
},

ch03: {
  id:'ch03', no:'03', stage:1, title:'安全概念与基本术语',
  lead:{
    goal:'掌握故障、失效、诊断、安全状态等术语的精确含义，能画出完整的故障响应链。',
    why:'第 5 章以后的全部机制设计，都建立在"故障检测 → 故障响应"这条链上；术语不精确，设计就会漏。',
    pre:'第 01-02 章。',
    rel:'故障链是第 05 章（调度）与第 14 章（系统设计）的主轴。'
  },
  concepts:[
    {t:'危险、风险、故障、失效', tag:'E', src:'E-CH03-DEF',
     def:'危险=潜在伤害源；风险=伤害概率×严重度；故障（fault）=可能导出失效的错误状态；失效（failure）=功能丧失或偏离。',
     body:`<p>区分 <b>fault</b> 与 <b>failure</b> 是安全工程的第一课：</p>
     <ul><li><b>故障（fault）</b>：系统内部的异常状态——RAM 某位翻转、时钟偏快 5%、寄存器卡位。它<b>可能</b>导致失效，也可能被诊断机制捕获。</li>
     <li><b>失效（failure）</b>：功能层面丧失或偏离——加热器该停没停、电机该转没转。</li></ul>
     <p>诊断机制（Diagnostic / Self-Test）的作用就是在故障演变成失效之前<b>拦截</b>它。检测不到的故障叫潜伏故障（latent fault），安全设计要尽量压缩潜伏故障的存在时间。</p>`},
    {t:'诊断机制与自检', tag:'R', src:'R-AN-TESTS',
     def:'自检（Self-Test）= 系统对自身硬件的主动检查；诊断机制（Diagnostic）= 更广义的检测手段（含硬件在线监测）。',
     body:`<p>瑞萨自检库中，两类手段并存（都已从源码核实）：</p>
     <ul><li><b>主动自检</b>：CPU 寄存器写读、RAM March、ROM CRC——需要专门 CPU 时间跑测试</li>
     <li><b>在线监测</b>：CAC 持续测频、LVD 持续监视电压、POEG 持续监听故障事件——配置一次，硬件自动工作</li></ul>
     <p>两者的调度策略不同（第 05 章），覆盖的故障类型也不同——所以 Class B 要求的是<b>一组</b>机制，不是单一银弹。</p>`},
    {t:'安全状态与故障响应', tag:'R', src:'R-AN-ERRLOOP',
     def:'安全状态=系统不会造成危害的状态。故障响应=检测到故障后进入安全状态的动作，标准将其定义为应用职责。',
     body:`<p>瑞萨库的代码把这个职责划分展示得非常清楚（已核实）：</p>
     <p>库内部所有测试失败都汇聚到 <code>Error_Detected_Loop(errno)</code>——它只是<b>报告</b>故障；而"进入什么样的安全状态"（关断加热器、锁死输出、复位重启…）由应用层决定。库源码注释原文："A user must set up a timeout period and window suitable for his project."</p>
     <p>为什么标准不替你定义安全状态？因为洗衣机和灶具的安全状态完全不同——只有懂产品的人才能定义。<b>这正是认证审核时被问得最多的地方。</b></p>`},
    {t:'控制器故障链路（本课程主图）', tag:'E', src:'E-CH03-CHAIN',
     def:'故障源 → 诊断机制 → 故障判定 → 故障响应 → 安全状态，任何一环缺失 = 整链无效。',
     body:`<p>把这张图记住，后面每一章都是在填这张图的一个环节：</p>
     <ul><li>故障源（第 6-9 章：CPU/RAM/Flash/时钟/看门狗/ADC/GPIO/电压/温度/输出）</li>
     <li>诊断机制（第 5 章：上电测试 + 周期测试 + 在线监测）</li>
     <li>故障判定（第 12 章：Error_Detected_Loop 汇聚）</li>
     <li>故障响应（第 14 章：应用定义的安全状态）</li>
     <li>验证证据（第 13 章：测试记录与追踪）</li></ul>`}
  ],
  figs:['fig-faultchain','fig-closure'],
  figcaps:{'fig-faultchain':'图 3-1 · 控制器故障链路：任一环节缺失则整链无效'},
  sim:'simFaultChain',
  quiz:[
    {q:'RAM 某存储位卡死在 1，但程序尚未读到该单元。这是故障还是失效？', opts:['失效','故障','既是故障也是失效','都不是'], a:1,
     exp:'异常状态已存在（故障），但功能尚未偏离（未失效）。诊断机制的目标正是在故障→失效之间拦截。这也解释了为什么 RAM 周期测试要在数据被使用前覆盖到它。', src:'E-CH03-DEF'},
    {q:'瑞萨自检库检测到 ROM CRC 不一致后，直接执行的动作是？', opts:['调用应用定义的安全状态函数','进入 Error_Detected_Loop 报告故障','自动复位 MCU','擦除 Flash 重写'], a:1,
     exp:'库内 ROM_Test_Failure → Error_Detected_Loop(errno)，只负责"报告+锁定"。"做什么安全动作"由应用定义——库注释明确要求用户自行设置合适的超时与窗口。', src:'R-AN-ERRLOOP'},
    {q:'以下哪个属于"在线监测"而不是"主动自检"？', opts:['RAM March 算法','CPU 寄存器 0x55/0xAA 写读','CAC 时钟频率交叉监测','ROM 全片 CRC 计算'], a:2,
     exp:'CAC 配置一次后由硬件持续测频，不占用 CPU 执行测试；其余三项都需要专门 CPU 时间执行。两类机制在库中并存且调度方式不同。', src:'R-AN-TESTS'},
    {q:'判断题：只要十项自检全部 PASS，控制器就是安全的。', opts:['正确','错误'], a:1,
     exp:'自检覆盖的是 MCU 硬件层。传感器漂移、执行器卡死、应用逻辑缺陷、多故障叠加都不在十项覆盖内——诊断覆盖有边界（第 9 章展开），系统安全还需要安全状态设计与验证。', src:'E-CH03-CHAIN'}
  ],
  summary:['fault（故障，内部异常）≠ failure（失效，功能偏离）；诊断在两者之间拦截','自检（主动，花 CPU 时间）与在线监测（被动，硬件自动）两类机制并存','安全状态由应用定义——认证审核重点','故障链五环节：源 → 诊断 → 判定 → 响应 → 证据'],
  next:'下一章：Class A / B / C —— 用分类判断器实测你的理解。'
},

ch04: {
  id:'ch04', no:'04', stage:1, title:'Class A / B / C 软件分级',
  lead:{
    goal:'掌握 Annex H 的软件三级分类，能对任意家电控制功能做正确分级。',
    why:'分级决定要求强度：你产品的每个控制功能都要归级，Class B 要求的自检表就是你的自检库的任务书。',
    pre:'第 01-03 章。',
    rel:'Class B 是第 5-12 章全部内容的适用范围。'
  },
  concepts:[
    {t:'三级的定义（按应用笔记转述）', tag:'R', src:'R-AN-CLASS',
     def:'Class A：不依赖其保证设备安全；Class B：用于防止设备不安全运行；Class C：用于防止特殊危险。',
     body:`<p>应用笔记第 1 页给出（瑞萨转述，正式定义以 IEC 60730-1:2022 Annex H 为准 <span class="tag tag-T" data-src="T-HCL">待核实</span>）：</p>
     <table><tr><th>级别</th><th>定义</th><th>典型例子</th><th>要求强度</th></tr>
     <tr><td><b>Class A</b></td><td>控制功能不打算依赖其来保证设备安全</td><td>室温调节、湿度控制、照明控制、定时器、开关</td><td>最低（不要求本课程的自检表）</td></tr>
     <tr><td><b>Class B</b></td><td>控制功能用于防止设备不安全运行</td><td>热断路器、洗衣机门锁</td><td>★ 本课程主线：十项自检 + 故障响应</td></tr>
     <tr><td><b>Class C</b></td><td>控制功能用于防止特殊危险</td><td>自动燃烧器控制</td><td>最严（附加要求）</td></tr></table>
     <p>应用笔记原文点名的典型场景：洗衣机、洗碗机、干衣机、冰箱、灶具<b>趋于落入 Class B</b>。</p>`},
    {t:'洗衣机控制器的分级实操', tag:'E', src:'E-CH04-WM',
     def:'同一台洗衣机，不同控制功能可能落在不同 Class——分级对象是"功能"不是"整机"。',
     body:`<p>以洗衣机为例做分级演练（E 类教学判断，正式定级需认证机构确认）：</p>
     <ul><li>洗涤节奏（正反转交替）：<b>Class A</b>——节奏乱了衣服洗不干净，但不会不安全</li>
     <li>加热管温度控制：超温有火灾风险 → <b>Class B</b></li>
     <li>门锁联锁（运行中不允许开门）：夹伤风险 → <b>Class B</b></li>
     <li>进水水位防止溢水：<b>Class B</b>（水淹风险）</li>
     <li>显示"剩余时间"：<b>Class A</b></li></ul>
     <p>要点：<b>Class B 的存在决定了整个控制器软件需要满足 Annex H 的 Class B 要求</b>，十项自检因此成为必选。</p>`},
    {t:'为什么"仅凭自检库"判断不了产品合规', tag:'R', src:'R-VDE-SCOPE',
     def:'库覆盖 MCU 硬件层；产品合规 = 分级正确 + 诊断策略完整 + 安全状态定义 + 验证证据 + 整机认证，链条缺一不可。',
     body:`<p>用本项目资料直接证明（全部已核实）：</p>
     <ul><li>VDE 检测报告的对象是"<b>自诊断例程</b>"（Self-Diagnostic Routines）——测的是库代码本身，不是你的产品</li>
     <li>报告明确声明："该报告不授权使用 VDE 认证标志，仅考虑下述规范的要求"——连 VDE 自己都划清了边界</li>
     <li>报告还注明：标 * 的例程（FPU 系列）<b>不适用于</b> RA2 (Cortex-M23)——连"库内的哪些函数对你的芯片有效"都需要核对</li></ul>
     <p>所以正确的心智模型：<b>库 = 经过验证的积木；产品合规 = 你用积木搭的房子通过验收。</b></p>`}
  ],
  figs:['fig-classabc'],
  figcaps:{'fig-classabc':'图 4-1 · Class A/B/C 要求强度递进，Class B 为家电主流'},
  sim:'simClassABC',
  quiz:[
    {q:'洗衣机"剩余时间显示"功能属于？', opts:['Class A','Class B','Class C','不需要分级'], a:0,
     exp:'显示错了不影响设备安全（不依赖它保证安全运行），属 Class A。分级对象是"控制功能"，一台设备内不同功能可以不同级。', src:'E-CH04-WM'},
    {q:'洗衣机门锁联锁功能失效会导致运行中开门（夹伤风险），应归入？', opts:['Class A','Class B','Class C','视品牌而定'], a:1,
     exp:'门锁用于防止设备不安全运行（夹伤），典型 Class B。应用笔记把"洗衣机门锁"列为 Class B 的标准例子。', src:'R-AN-CLASS'},
    {q:'VDE 检测报告中标 * 的例程（FPU 系列）对 RA2E1（Cortex-M23）的状态是？', opts:['必须额外购买','不适用（M23 无 FPU）','仅调试模式可用','需要手动使能'], a:1,
     exp:'证书 Remark 原文："Routine marked with * are not applicable for RA2 with Arm Cortex-M23 family."——M23 核心没有 FPU，FPU 测试无对象。这也解释了库源码中 FPU 代码被宏自动排除的设计。', src:'R-VDE-ROUTINES'},
    {q:'判断题：只要全部控制功能都跑着 VDE 评估过的自检库，整机就满足 IEC 60730 Class B。', opts:['正确','错误'], a:1,

     body:`<p>库的周期 RAM 测试（PeriodicTest_RAM）逻辑：</p>
     <ul><li>维护测试区游标，每次 80ms 节拍测一块</li>
     <li>测前备份 → March → 恢复 → 游标推进</li>
     <li>一块不通过（如 TRUE != PeriodicTest_RAM()）则停留重试/报错，不盲目前进</li></ul>
     <p>测试区规划是<b>你的集成参数</b>：必须避开栈、堆、活跃全局变量——RA2E1 RAM 只有 16KB（datasheet Rev.1.70），规划要精打细算。</p>`},
    {t:'Flash/ROM 完整性：CRC 工程链路', tag:'R', src:'R-AN-CRC',
     def:'构建后处理用 srec_cat 对固件算 CRC 并写入镜像尾部；运行时硬件 CRC 外设重算，与 ROM 中的期望值比对。',
     body:`<p>完整链路（全部已核实）：</p>
     <ul><li><b>构建时</b>：srec_cat 把 ROM 填 0xFF → 裁剪出计算区（预留末 4 字节）→ 算 CRC 写入 → 输出新镜像</li>
     <li><b>上电时</b>：Tests_PowerOn 里 CRC_AddRange 按 CRC_Ranges 表逐段累加 → CRC_Verify(~CRC_value, CRC_ADDRESS) 与期望值比对</li>
     <li><b>运行中</b>：PeriodicTest_CRC 用 static index <b>分段累加</b>（每次节拍算一段，几轮算完全片）——不是每次全片重算</li></ul>
     <p><b>期望值硬编码是大忌</b>：任何代码改动都会改变 CRC，必须走构建后处理自动注入。</p>`},
    {t:'CRC 的能力边界', tag:'E', src:'E-CH07-CRCB',
     def:'CRC 能发现绝大多数位翻转与突发错误，但不是全知：某些多位组合错误会漏检（概率极低但非零）。',
     body:`<p>数学事实：CRC 是线性校验，存在错误图样使其余数恰好为 0（漏检）。工程对策：</p>
     <ul><li>选多项式与宽度足够（32 位 CRC 漏检概率 ~2⁻³² 量级）</li>
     <li>CRC 只是<b>完整诊断体系的一环</b>——配合 RAM March、程序流检查互为补充</li>
     <li>不能宣称"CRC 通过 = Flash 完全无错"，认证文件里要如实写覆盖能力</li></ul>
     <p>用下面的模拟器直观感受：翻转 1 位必检出；翻转特定多位组合可能侥幸漏过。</p>`}
  ],

  figcaps:{'fig-march':'图 7-1 · March-C 六步：升序降序对称覆盖耦合方向'},

-crop 0x7FFFC 0x80000
Original.srec
-fill 0xFF 0x000000 0x07FFFC
-Output addcrc.srec           # 输出含期望值的新镜像`},
    {title:'上电 CRC 验证（真实代码节选）', src:'SelfTestLib/src/RA_SelfTests.c · Tests_PowerOn', code:
`CRC_Init();  CRC_Start();
for (index = 0; index < CRC_RANGE_NUM; index++)
{
    CRC_AddRange((uint32_t*)CRC_Ranges[index].Start,

}

    {q:'修改了一行代码后，ROM CRC 期望值如何处理？', opts:['不用管','手动改源码里的期望值','构建后处理自动重算注入','发送给认证机构'], a:2,

ch08: {
  id:'ch08', no:'08', stage:2, title:'时钟、定时器与看门狗',
  lead:{
    goal:'理解时钟交叉监测（CAC）的原理与"独立时钟源"的意义；掌握 IWDT 的双路径验证。',
    why:'时钟是一切时序的基础：主时钟漂了，所有"毫秒"都不可信——包括看门狗的超时判定本身。',
    pre:'第 05 章。',
    rel:'库中 ClockMonitor_Init 与 IWDT_Init 的真实参数在此展开。'
  },
  concepts:[
    {t:'时钟失效的后果谱系', tag:'E', src:'E-CH08-CLKF',
     def:'主频漂移 → 定时失准（加热时间失控）；时钟停振 → 系统冻结；锁相失败 → 频率紊乱。看门狗能兜底"冻结"，但兜不住"漂移"。',
     body:`<p>把时钟故障按"严重度×检出难度"排个序：</p>
     <ul><li><b>停振</b>：最容易感知（一切停止），IWDT 兜底</li>
     <li><b>漂移</b>：最难察觉——定时任务悄悄变慢/变快，温度控制窗口悄悄偏移。必须专门的频率监测</li>
     <li><b>紊乱</b>：PLL 失锁等，介于两者之间</li></ul>
     <p>所以 Class B 要求的时钟诊断不是"有没有时钟"，而是"<b>频率准不准</b>"。</p>`},
    {t:'CAC 交叉测频：独立参考源是灵魂', tag:'R', src:'R-AN-CAC',
     def:'CAC（时钟频率精度测量电路）用独立时钟测主频：库中用 HOCO 做被测、IWDTCLK(15kHz) 做参考，频率比超容差即回调 Clock_Test_Failure。',
     body:`<p>真实调用（RA_SelfTests.c 实测）：</p>
     <p><code>ClockMonitor_Init(HOCO, IWDTCLK, CLOCK_FREQ_MAIN, 15000, Clock_Test_Failure);</code></p>
     <p>原理：参考时钟在精确窗口内开门计数，被测时钟数脉冲 → 实测频率比 → 与标称比+容差比较。为什么必须独立参考？<b>主时钟自己测自己，漂移了参考也一起漂，永远"正常"。</b>IWDTCLK 来自独立振荡器，与 HOCO 无共因失效。</p>
     <p>库源码 ClockMonitor_Init 的关键步骤（实测）：PRCR 解锁(0xA502) → MSTPCRC 开模块时钟 → CACR1 选 HOCO 输入 → 配分频与容差 → 使能中断。注意寄存器保护解锁的固定序列 <code>PRCR = 0xA502</code>——RA 系列写保护机制，错序写入无效。</p>`},
    {t:'IWDT 独立看门狗：双路径验证', tag:'R', src:'R-AN-IWDT',
     def:'验证两件事：①正常喂狗时不复位；②故意不喂狗时确实复位。复位后查复位标志区分原因。',
     body:`<p>"看门狗在跑"≠"看门狗有效"。库的验证思路（iwdt.c + RA_SelfTests.c 实测）：</p>
     <ul><li><b>路径一（正向）</b>：IWDT_Init 后，从 now on IWDT_Kick must regularly be called——主循环按周期喂狗，系统正常运行</li>
     <li><b>路径二（反向）</b>：故意不喂 → 超时 → NMI/复位 → <code>Check_ResetCause()</code> 检查 <code>IWDT_DidReset()</code>，确认 IWDT 复位被识别，调 Watchdog_Test_Failure</li></ul>
     <p>源码注释要求："A user must set up a timeout period and window suitable for his project"——超时周期与窗口是<b>你的</b>集成参数，要覆盖"最慢的合法任务"又不能太宽。</p>
     <p>独立性：IWDT 用独立时钟（LOCO），主时钟失效时它仍活着——与 CAC 的参考源思想一脉相承。</p>`},
    {t:'看门狗不是万能兜底', tag:'E', src:'E-CH08-WDTL',
     def:'IWDT 能检出"程序卡死/跑飞"，检不出"程序在跑但算错"——后者靠程序流检查与计算冗余。',
     body:`<p>程序"活着但疯了"的场景：主循环全速运行、定时喂狗一丝不苟，但控制算法因 RAM 位翻转算出了错误的占空比。IWDT 全程绿灯，危险照样发生。</p>
     <p>结论：看门狗 = <b>活性</b>（liveness）监控；诊断体系 = 活性 + <b>正确性</b>（integrity）双保险。十项自检各管一段，缺一不可。</p>`}
  ],
  figs:['fig-cac'],
  figcaps:{'fig-cac':'图 8-1 · CAC 交叉测频：独立 IWDTCLK 做参考，主频漂移无所遁形'},
  sim:'simClock',
  code:[
    {title:'ClockMonitor_Init 关键步骤（真实代码节选）', src:'SelfTestLib/src/Tests/CLOCK_test/clock_monitor.c', code:
`void ClockMonitor_Init(clock_source_t target_clock, clock_source_t ref_clock,
                       uint32_t target_clock_frequency,
                       uint32_t ref_clock_frequency,
                       CLOCK_MONITOR_ERROR_CALL_BACK CallBack)
{
    g_CallBackClock = CallBack;          /* 保存失败回调 */
    PRCR_reg->PRCR = 0xA502;             /* 解除寄存器写保护 */
    MSTPCRC_reg->MSTPCRC_b.MSTPC0 = 0;   /* 打开 CAC 模块时钟 */
    PRCR_reg->PRCR = 0xA500;             /* 恢复写保护 */
    switch (target_clock) {              /* 选择被测时钟 */
    case (MAIN):      CACR1_reg->CACR1 = 0x00; break;
    case (SUB_CLOCK): CACR1_reg->CACR1 = 0x02; break;
    case (HOCO):      CACR1_reg->CACR1 = 0x04; break;
    ...
    }
}`}
  ],
  quiz:[
    {q:'CAC 时钟监测为什么必须用"独立"参考时钟？', opts:['省电','参考与被测无共因失效，主频漂移才能被真实反映','参考时钟更便宜','标准规定用 LOCO'], a:1,
     exp:'若用主时钟自身或其衍生时钟做参考，主频漂移时参考同步漂移，比值永远正常。库选 IWDTCLK(15kHz) 独立振荡器，与 HOCO 无共因路径。', src:'R-AN-CAC'},
    {q:'IWDT"双路径验证"的反向路径是？', opts:['快速连续喂狗','故意不喂狗，验证超时复位确实发生且可被识别','关闭中断喂狗','更换时钟源'], a:1,
     exp:'正向路径证明"不该复位时没复位"，反向路径证明"该复位时真复位"且复位原因可被 Check_ResetCause/IWDT_DidReset 识别——缺一不可。', src:'R-AN-IWDT'},
    {q:'RA 系列解除寄存器写保护（PRC1）的正确序列是？', opts:['PRCR=0xA502 → 操作 → PRCR=0xA500','PRCR=0xA500 → 操作','直接写寄存器','复位后自动解锁'], a:0,
     exp:'ClockMonitor_Init 实测：先 PRCR=0xA502 解锁，操作 MSTPCRC，再 PRCR=0xA500 恢复保护。RA 系列关键寄存器均有此写保护机制，错序写入无效。', src:'R-AN-CAC'},
    {q:'程序全速运行、定时喂狗正常，但控制算法因数据损坏算错占空比。哪种机制能拦住它？', opts:['IWDT','CAC 时钟监测','RAM March 周期测试 + 计算冗余','提高主频'], a:2,
     exp:'IWDT 只监控活性（卡死/跑飞），不监控正确性。"活着但算错"要靠 RAM 数据完整性测试与计算冗余/程序流检查——这正是十项自检必须成体系的原因。', src:'E-CH08-WDTL'}
  ],
  summary:['时钟故障谱系：停振（IWDT 兜底）/ 漂移（CAC 专管）/ 紊乱','CAC = 独立参考源交叉测频；独立性 = 无共因失效','IWDT 双路径验证：喂狗不复位 + 不喂狗必复位可识别','看门狗管活性不管正确性——体系互补'],
  next:'下一章：ADC、GPIO 与其他外设诊断。'

ch09: {
  id:'ch09', no:'09', stage:2, title:'ADC、GPIO 与其他外设诊断',
  lead:{
    goal:'掌握 ADC 自校准/一致性检查、GPIO 回读验证、电压/温度监测的原理与边界。',
    why:'洗衣机靠 ADC 读水温水位、靠 GPIO/输出通道驱动电机与阀——模拟与数字边界的失效最贴近真实事故。',
    pre:'第 05-08 章。',
    rel:'POE 输出强制关断是家电安全的最关键一环，重点展开。'
  },
  concepts:[
    {t:'ADC 诊断：用"已知答案"考 ADC', tag:'R', src:'R-AN-ADC',
     def:'采样片上已知电压（如 VREF），转换结果与预期码值比对；配合多通道轮换检测通道粘连。',
     body:`<p>库的思路（test_adc.c 实测）：上电诊断 Test_ADC_Start → Test_ADC_Wait；运行中 Test_ADC12_CheckResult 周期调用。检查项：</p>
     <ul><li><b>参考校验</b>：内部已知电压的转换码值落在容差窗口 → 证明转换增益/失调正常</li>
     <li><b>通道一致性</b>：多通道轮换，相邻通道读数异常相关 → 粘连（channel crosstalk/stuck）</li></ul>
     <p><b>边界</b>：这测的是 ADC 本身。传感器漂移（NTC 老化）、线束断路不在 ADC 诊断覆盖内——那是应用层传感器诊断（合理性检查、冗余传感）的职责。</p>`},
    {t:'温度传感器：合理性窗口', tag:'R', src:'R-AN-TEMP',
     def:'读片上温度传感器，校验数值在合理范围——特征值（0x000/0xFFF 卡死）与超范围值都报错。',
     body:`<p>真实调用（已实测）：</p>
     <p><code>Temperature_Init(TEMPERATURE_ADC_MIN, TEMPERATURE_ADC_MAX, Temperature_Test_Failure);</code></p>
     <p>周期测试模式很有意思：80ms 回调里只置标志 <code>g_bReadTemperature = TRUE</code>，实际读取在主循环完成——<b>测试调度与业务执行解耦</b>，避免中断上下文做长操作。读出值超 [MIN, MAX] 窗口即触发失败回调。开路/短路的特征码值（贴边 0x000/0xFFF）自然被窗口拦住。</p>`},
    {t:'电压监测：LVD 阈值比对', tag:'R', src:'R-AN-VOLT',
     def:'LVD（低压检测）将 VDD 与内部参考比较，越限触发中断/复位；阈值由集成者选择。',
     body:`<p>真实调用（已实测）：</p>
     <p><code>VoltageMonitor_Init(VOLTAGE_MONITOR_LEVEL_2_79);</code> —— RA2L1 分支选 2.79V 阈值（RA6 分支为 2.92V）。</p>
     <p>为什么阈值是集成参数：你的供电设计（LDO 精度、电压裕量）决定"多低算危险"。Flash 写入、RAM 保持、IO 电平在欠压时都不可信——阈值要赶在"不可信"之前触发响应。</p>`},
    {t:'GPIO：输出回读与输入验证', tag:'R', src:'R-AN-GPIO',
     def:'输出测试：写电平后回读端口寄存器比对；输入测试：施加已知电平验证读取正确。',
     body:`<p>库的 gpio.c/gpio_config.h 把测试引脚做成可配置表。要点：</p>
     <ul><li>回读测的是<b>端口寄存器到引脚</b>的通路（部分 MCU 支持读引脚电平寄存器，能覆盖到焊点/走线级）</li>
     <li>测试引脚的选择是集成参数：不能选驱动继电器的功率脚（会误动作执行器）</li>
     <li>别忘了复用为<b>模拟功能</b>的脚也要纳入验证范围（连通性）</li></ul>`},
    {t:'POE：软件检测、硬件强制关断（家电安全关键）', tag:'R', src:'R-AN-POE',
     def:'POEG 单元经 IELSRn 事件链接收故障事件，硬件直接把 GPT 输出（GTIOC0A/B）置安全电平——不经过 CPU。',
     body:`<p>为什么这一项对家电最关键：电机/加热管由 PWM 驱动，故障发生时如果还要"CPU 跑代码去关 PWM"，CPU 恰恰是可能已经坏掉的那个部件。<b>POE 链路完全绕开 CPU</b>：</p>
     <p>故障事件 → IELSRn 事件链接 → POEG → GPT 输出强制安全电平（硬件路径，μs 级）</p>
     <p>库的验证方式：真实触发一次 POEG 事件（POE.c + GPT.c 配合），确认 GTIOC 输出确实被关断——即"检测到关断失效"才算诊断有效。引脚定义在 RA_SelfTests.h（RA2L1 分支 GTIOC0A=P415 / GTIOC0B=P414），<span class="tag tag-T" data-src="T-POEPIN">待核实：RA2E1 封装的对应引脚需按数据手册核对</span>。</p>
     <p>事件链接设置详见应用笔记 Table 2.3（CAC）与 Table 2.7（POEG）——RA2L1 与 RA2E1 设置完全相同（已核实）。</p>`}

window.GLOSSARY = {
'Annex H':'IEC 60730-1 的附录 H，规定使用软件的电子控制系统的要求：软件分级（Class A/B/C）与各级测试要求（表 H.11.12.1），是嵌入式软件工程师的核心章节。',
'Class B':'Annex H 软件分级的中级：控制功能用于防止设备不安全运行。白色家电（洗衣机/洗碗机/冰箱/灶具）趋于此类，触发十项自检要求。',
'故障 (Fault)':'系统内部可能导出失效的异常状态（如 RAM 位翻转）。与失效（failure，功能偏离）严格区分——诊断机制在两者之间拦截。',
'失效 (Failure)':'功能丧失或偏离预期（如加热器该停没停）。诊断的目标是让故障不演变为失效。',
'安全状态 (Safe State)':'系统不会造成危害的状态。其定义是应用职责——洗衣机与灶具的安全状态完全不同，只有懂产品的人能定义。',
'自检 (Self-Test)':'系统对自身硬件的主动检查，需要占用 CPU 执行时间（如 RAM March、CPU 寄存器写读）。',
'在线监测 (Online Monitoring)':'配置一次后由硬件持续工作的检测手段（如 CAC 测频、LVD 监视电压、POEG 监听故障），不占 CPU 测试时间。',
'周期测试 (Periodic Test)':'运行期间分块轮转执行的自检：由定时器节拍（库中 80ms）调度，每拍只测一小块并备份/恢复数据，兼顾实时性与覆盖。',
'March 算法':'RAM 测试算法族：按固定序列对每个单元执行读-写走查（如 March-C 六步），能覆盖卡位与耦合故障。升序+降序对称覆盖耦合的两个方向。',
'CRC (Cyclic Redundancy Check)':'循环冗余校验。ROM 诊断用法：构建时 srec_cat 计算 CRC 注入镜像尾部，运行时重算比对。存在理论漏检图样（多位组合恰好余 0），概率极低但非零。',
'CAC':'Clock Frequency Accuracy Measurement Circuit，时钟频率精度测量电路。用独立参考时钟测主频，频率比超容差报警——RA2E1 安全相关外设之一。',
'POEG':'Port Output Enable Gating，端口输出使能门控单元。经事件链接收故障事件，硬件直接把 GPT PWM 输出置安全电平，不经过 CPU——家电安全最后一道防线。',
'IELSRn':'事件链接系统的通道寄存器（Event Link Controller）。把外设事件路由到指定处理单元，CAC/POEG 的中断路由依赖它（应用笔记 Table 2.3/2.7）。',
'IWDT':'Independent Watchdog，独立看门狗。使用独立时钟（不随主时钟失效），验证思路为双路径：喂狗不复位 + 停喂必复位可识别。',
'LVD':'Low Voltage Detection，低压检测。将 VDD 与内部参考比较，越限触发中断/复位。阈值档位是集成参数。',
'srec_cat':'S-record 处理工具。本项目用于构建后处理：ROM 填充→裁剪计算区→计算 CRC→写入期望值→输出新镜像。',
'PRCR':'RA 系列寄存器保护寄存器。关键寄存器写保护：先写 0xA502 解锁，操作后写 0xA500 恢复（源码实测序列）。',
'HOCO':'High Speed On-Chip Oscillator，高速片上振荡器。RA2E1 为 48MHz，是 hwsetup.h 中 CLOCK_FREQ_HOCO 常数的来源。',
'IWDTCLK / LOCO':'独立看门狗时钟/低速片上振荡器（约 15kHz）。CAC 监测的独立参考源与 IWDT 的时钟来源。',
'VDE':'德国电气工程师协会检验认证研究所（VDE Prüf- und Zertifizierungsinstitut GmbH）。本项目库的检测机构：Prüfbericht ref 5027124-4970-0001/293624（2022-06-22）。',
'Prüfbericht':'德语"检测报告"。VDE 报告首页明示：报告包含一次单独调查的结果，不授权使用 VDE 认证标志——检测报告≠认证证书≠认证标志。',
'耦合故障 (Coupling Fault)':'写一个存储/寄存器单元导致相邻单元变化的故障。单寄存器 0x55/0xAA 测试测不出，需要耦合测试（散布图样交叉验证）。'
};

window.SIMS = {};
/* kebab-case 别名（章节引用 fig-xxx，定义用 figXxx） */
Object.keys(window.FIGURES).forEach(k=>{window.FIGURES[k.replace(/([A-Z])/g,(m,c)=>'-'+c.toLowerCase())]=window.FIGURES[k];});
window.initSims = function(){
  /* --- 故障链 --- */
  window.SIMS.simFaultChain = function(el){
    el.innerHTML = `<h4>交互实验 · 故障链演示</h4><div class="snote">E｜教学示例。点击环节将其"击穿"，观察整链状态。</div>
    <div class="ctrl" id="fcBtns">${['故障源','诊断机制','故障判定','故障响应','安全状态'].map((n,i)=>`<button class="ghost" data-i="${i}">击穿 ${n}</button>`).join('')}<button id="fcReset">重置</button></div>
    <div class="disp" id="fcOut">链条完整：故障将被拦截在演变为失效之前。逐个"击穿"环节试试。</div>`;
    const out=el.querySelector('#fcOut');
    const msgs=['故障源失效：正常世界本来就有故障——所以才需要诊断机制。','诊断机制被击穿：故障无人拦截，潜伏故障无限期存活。','故障判定失效：检出了却没有汇聚上报——等于没检出。','故障响应缺失：知道有故障但什么都不做——认证直接不通过。','安全状态未定义：链路最后一环断裂，危害仍会发生。'];
    el.querySelectorAll('#fcBtns button[data-i]').forEach(b=>b.onclick=()=>{out.className='disp bad';out.textContent='✗ '+msgs[b.dataset.i];});
    el.querySelector('#fcReset').onclick=()=>{out.className='disp';out.textContent='链条完整：故障将被拦截在演变为失效之前。';};
  };
  /* --- Class 判断器 --- */
  window.SIMS.simClassABC = function(el){
    const qs=[
      {q:'洗涤节奏（正反转交替）控制',a:0,e:'节奏乱了洗不干净，但不会不安全 → Class A。'},
      {q:'加热管温度控制（超温有火灾风险）',a:1,e:'防止不安全运行 → Class B（本课程主线）。'},
      {q:'门锁联锁（运行中开门有夹伤风险）',a:1,e:'应用笔记把"洗衣机门锁"列为 Class B 典型例子。'},
      {q:'剩余时间显示',a:0,e:'显示错误不影响安全 → Class A。'},
      {q:'自动燃烧器点火控制',a:2,e:'防止特殊危险（燃气泄漏/爆燃）→ Class C。'}];
    el.innerHTML=`<h4>交互实验 · Class A/B/C 判断器</h4><div class="snote">E｜教学示例（正式定级需认证机构确认）。判断下列控制功能的分级：</div>
      <div class="disp" id="caQ"></div><div class="ctrl" id="caBtns"><button data-v="0">Class A</button><button data-v="1">Class B</button><button data-v="2">Class C</button></div><div class="disp" id="caOut">从第 1 题开始。</div>`;
    let i=0,ok=0; const qEl=el.querySelector('#caQ'),o=el.querySelector('#caOut');
    const show=()=>{qEl.textContent=(i<qs.length)?`Q${i+1}/5：${qs[i].q}`:'全部完成！';};
    el.querySelectorAll('#caBtns button').forEach(b=>b.onclick=()=>{
      if(i>=qs.length)return;
      const v=+b.dataset.v;
      if(v===qs[i].a){ok++;o.className='disp good';o.textContent='✓ 正确。'+qs[i].e;}
      else{o.className='disp bad';o.textContent='✗ 再想想。'+qs[i].e;}
      i++;setTimeout(()=>{if(i<qs.length){show();o.className='disp';o.textContent=`当前得分 ${ok}/${i}`;}else{o.className='disp good';o.textContent=`完成：${ok}/5 正确。记住：分级对象是"功能"，混合分级很常见。`;}},1400);
    });show();
  };
  /* --- 周期调度器 --- */
  window.SIMS.simScheduler = function(el){
    const seq=['CPU','RAM_BUF','RAM','STACK','CRC','ADC','TEMP'];
    el.innerHTML=`<h4>交互实验 · 80ms 周期轮转模拟</h4><div class="snote">E｜教学示例，模拟 PeriodicTestCallBack 状态机（非真实硬件）。</div>
    <div class="ctrl"><button id="scTick">+1 节拍 (80ms)</button><button id="scAuto" class="ghost">自动运行</button><button id="scReset" class="ghost">复位</button><span style="font-size:12px;color:var(--sub)">轮次/指针：</span><span class="disp" style="min-width:90px;margin:0;padding:4px 10px" id="scIdx">CPU</span></div>
    <div class="disp" id="scLog">节拍日志：</div>`;
    let idx=0,tick=0,timer=null;const log=el.querySelector('#scLog');
    el.querySelector('#scTick').onclick=()=>step();
    el.querySelector('#scAuto').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='自动运行';}else{timer=setInterval(step,600);e.target.textContent='停止';}};
    el.querySelector('#scReset').onclick=()=>{idx=0;tick=0;log.textContent='节拍日志：';el.querySelector('#scIdx').textContent=seq[0];};
    function step(){tick++;const t=seq[idx];idx=(idx+1)%seq.length;
      log.textContent=`节拍日志：\n[${String(tick*80).padStart(5)}ms] 执行 ${t}${t==='CRC'?'（分段累加，多轮覆盖全片）':''}`;
      log.textContent='\n'+log.textContent.trim();el.querySelector('#scIdx').textContent=seq[idx];}
  };
  /* --- CPU 0x55/0xAA --- */
  window.SIMS.simCPU = function(el){
    el.innerHTML=`<h4>交互实验 · CPU 寄存器 0x55/0xAA 测试模拟</h4><div class="snote">E｜教学示例：8 位简化模型，非真实寄存器操作。</div>
    <div class="ctrl"><label style="font-size:12.5px;color:var(--sub)">注入故障：<select id="cpuFault"><option value="none">无故障</option><option value="stuck0">b3 卡 0</option><option value="stuck1">b4 卡 1</option></select></label>
    <button id="cpuRun">执行测试</button></div>
    <div class="disp" id="cpuOut">写入图样 → 读回比对。执行测试看结果。</div>`;
    const out=el.querySelector('#cpuOut');
    el.querySelector('#cpuRun').onclick=()=>{
      const f=el.querySelector('#cpuFault').value;
      const w1=0x55,w2=0xAA;
      const rd=v=>{let r=v;if(f==='stuck0')r&=~0x08;if(f==='stuck1')r|=0x10;return r>>>0;};
      const b=v=>('00000000'+v.toString(2)).slice(-8);
      let lines=[`写 0x55 (${b(w1)}) → 读回 0x${rd(w1).toString(16).toUpperCase()} (${b(rd(w1))}) ${rd(w1)===w1?'✓':'✗ 不一致！卡位检出'}`,
                 `写 0xAA (${b(w2)}) → 读回 0x${rd(w2).toString(16).toUpperCase()} (${b(rd(w2))}) ${rd(w2)===w2?'✓':'✗ 不一致！卡位检出'}`];
      const pass=rd(w1)===w1&&rd(w2)===w2;
      out.className='disp '+(pass?'good':'bad');
      out.textContent=lines.join('\n')+(pass?'\n→ PASS：寄存器健康':(f==='stuck0'?'\n→ FAIL：卡 0 在写 0x55 时暴露（互补图样缺一不可）':'\n→ FAIL：卡 1 在写 0xAA 时暴露'));
    };
  };
  /* --- March C --- */
  window.SIMS.simMarch = function(el){
    el.innerHTML=`<h4>交互实验 · March-C 六步动画（16 单元简化）</h4><div class="snote">E｜教学示例。蓝色=0 绿=1；可注入"写 A 影响 B"耦合故障。</div>
    <div class="ctrl"><label style="font-size:12.5px;color:var(--sub)"><input type="checkbox" id="mCouple" style="accent-color:var(--accent)"> 注入耦合故障（STEP2 写 n 时 n+1 被带翻）</label>
    <button id="mRun">▶ 单步执行</button><button id="mAuto" class="ghost">自动</button><button id="mRst" class="ghost">复位</button></div>
    <div class="cellbox" id="mGrid"></div><div class="disp" id="mOut">STEP1 待执行：全写 0。</div>`;
    const grid=el.querySelector('#mGrid'),out=el.querySelector('#mOut');
    let cells,step;const N=16;
    function reset(){cells=Array(N).fill(0);step=0;draw(-1);out.className='disp';out.textContent='STEP1 待执行：全写 0。';}
    function draw(cur){grid.innerHTML=cells.map((v,i)=>`<div class="cell ${v?'c1':'c0'} ${i===cur?'cur':''}">${i}</div>`).join('');}
    // steps: each = {dir, mode}  mode: w0 (write 0, read prev 1 implied), simplified: read-then-write sequences
    function doStep(){
      const couple=el.querySelector('#mCouple').checked;
      if(step===0){cells.fill(0);out.textContent='STEP1：全写 0 ✓';step=1;}
      else if(step>=1&&step<=4){
        const up=step<=2;const read=step%2===1?(step===1?0:1):(step===2?1:0);
        // map: step1=up read0 write1; step2=up read1 write0; step3=down read0 write1; step4=down read1 write0
        const seqI=step-1;const idxs=[];for(let k=0;k<N;k++)idxs.push(up?k:N-1-k);
        let cur=idxs[(marchPos++)%N];
        const expect=(step===1||step===3)?0:1;const write=expect?0:1;
        // actually: step1: read0 write1; step2: read1 write0; step3: read0 write1(down); step4: read1 write0(down)
        const writeVal=(step===1||step===3)?1:0;
        let msg=`STEP${step+1}（${up?'↑升序':'↓降序'}，地址 ${cur}）：读 ${expect===0?'0':'1'} → 写 ${writeVal}`;
        let fault=false;
        if(cells[cur]!==expect){msg+=' ✗ 读到 '+cells[cur]+'——卡位/残留检出！';fault=true;}
        cells[cur]=writeVal;
        if(couple&&step===1&&cur%2===0&&cur+1<N){cells[cur+1]^=1;msg+=' ⚡耦合：写 n 带翻 n+1（此时未被读，STEP 后续会暴露）';}
        out.textContent=msg;out.className='disp '+(fault?'bad':'');
        draw(cur);
        if(marchPos>=N){marchPos=0;step++;if(step===5){const ok=cells.every(v=>v===0);out.textContent=ok?'STEP6：全读 0 ✓ → PASS':(out.textContent+'\nSTEP6：全读 0 ✗ 有单元非 0 → FAIL（耦合残留暴露！）');out.className='disp '+(ok?'good':'bad');}}
      }
      if(step>=6&&step!==0){}
    }
    let marchPos=0;
    el.querySelector('#mRun').onclick=doStep;
    el.querySelector('#mAuto').onclick=e=>{if(e.target._t){clearInterval(e.target._t);e.target._t=null;e.target.textContent='自动';}else{e.target._t=setInterval(()=>{if(step<6)doStep();else{clearInterval(e.target._t);e.target._t=null;e.target.textContent='自动';}},150);}};
    el.querySelector('#mRst').onclick=()=>{marchPos=0;reset();};
    reset();
  };
  /* --- 时钟/看门狗 --- */
  window.SIMS.simClock = function(el){
    el.innerHTML=`<h4>交互实验 · CAC 测频 + 看门狗超时模拟</h4><div class="snote">E｜教学示例：拖动滑块模拟主频漂移与喂狗间隔。</div>
    <div class="ctrl"><span style="font-size:12.5px;color:var(--sub)">主频漂移：</span><input type="range" id="clkDrift" min="-30" max="30" value="0"><span class="disp" style="margin:0;padding:2px 10px" id="clkV">0%</span>
    <span style="font-size:12.5px;color:var(--sub)">喂狗间隔：</span><input type="range" id="wdIv" min="50" max="300" value="100"><span class="disp" style="margin:0;padding:2px 10px" id="wdV">100ms</span></div>
    <div class="disp" id="clkOut"></div>`;
    const upd=()=>{const d=+el.querySelector('#clkDrift').value,w=+el.querySelector('#wdIv').value;
      el.querySelector('#clkV').textContent=d+'%';el.querySelector('#wdV').textContent=w+'ms';
      let s1=(Math.abs(d)<=5)?'✓ CAC：频率比在 ±5% 容差内 → 正常':'✗ CAC：频率比越容差 → Clock_Test_Failure 触发';
      let s2=(w<=200)?'✓ IWDT：喂狗间隔 < 超时窗口(200ms) → 正常':'✗ IWDT：喂狗间隔超窗口 → 超时复位（Check_ResetCause 将识别）';
      el.querySelector('#clkOut').innerHTML=`<span class="${Math.abs(d)<=5?'good':'bad'}">${s1}</span>\n<span class="${w<=200?'good':'bad'}">${s2}</span>\n<span style="color:var(--sub)">思考：漂移 3% 时 CAC 说正常——你的"安全定时任务"能容忍 3% 吗？容差参数就是集成决策。</span>`;};
    el.querySelectorAll('input').forEach(i=>i.oninput=upd);upd();
  };
  /* --- ADC --- */
  window.SIMS.simADC = function(el){
    el.innerHTML=`<h4>交互实验 · ADC 参考校验模拟</h4><div class="snote">E｜教学示例：10 位 ADC 满量程 3.3V，采样已知 1.5V 内部参考。</div>
    <div class="ctrl"><span style="font-size:12.5px;color:var(--sub)">转换增益误差：</span><input type="range" id="adcG" min="-15" max="15" value="0"><span class="disp" style="margin:0;padding:2px 10px" id="adcV">0%</span></div>
    <div class="disp" id="adcOut"></div>`;
    const upd=()=>{const g=+el.querySelector('#adcG').value;el.querySelector('#adcV').textContent=g+'%';
      const ideal=Math.round(1.5/3.3*1023);const meas=Math.round(ideal*(1+g/100));
      const pass=Math.abs(g)<=3;
      el.querySelector('#adcOut').className='disp '+(pass?'good':'bad');
      el.querySelector('#adcOut').textContent=`期望码值 ${ideal}（1.5V/3.3V×1023）\n实测码值 ${meas}（增益 ${g}%）\n→ ${pass?'PASS：转换链路正常（±3% 容差内）':'FAIL：增益越限 → ADC_Test_Failure'}\n注意：这测的是 ADC 本身——NTC 老化漂移不在其覆盖内（应用层传感器诊断补位）。`;};
    el.querySelector('#adcG').oninput=upd;upd();
  };
  /* --- 状态机 --- */
  window.SIMS.simFSM = function(el){
    const steps=['RESET','PWR_CPU','PWR_RAM','PWR_CRC','PWR_ADC','IWDT_ON','MON_INIT','RUNNING'];
    el.innerHTML=`<h4>交互实验 · 自检状态机推演</h4><div class="snote">E｜教学示例。逐阶段推进；可注入上电故障。</div>
    <div class="ctrl"><button id="fsmNext">推进 →</button><select id="fsmInject"><option value="">不注入</option><option value="1">PWR_CPU 失败</option><option value="3">PWR_CRC 失败</option></select><button id="fsmR" class="ghost">复位</button></div>
    <div class="disp" id="fsmOut">当前状态：RESET</div>`;
    let i=0;const out=el.querySelector('#fsmOut');
    el.querySelector('#fsmNext').onclick=()=>{const inj=el.querySelector('#fsmInject').value;
      if(i>=steps.length-1){out.className='disp good';out.textContent='RUNNING：周期轮转开始（每 80ms），监测已全部挂上。';return;}
      i++;
      if(inj&&+inj===i){out.className='disp bad';out.textContent=`✗ ${steps[i]} FAIL → Error_Detected_Latch（上电失败=拒绝进入运行态，锁存 errno=${i}）`;return;}
      out.className='disp good';out.textContent='→ '+steps[i]+(steps[i]==='IWDT_ON'?'（IWDT 最后初始化——防止上电测试被误杀）':steps[i]==='MON_INIT'?'（CAC/LVD/温度/POE 配置一次持续工作）':'');
    };
    el.querySelector('#fsmR').onclick=()=>{i=0;out.className='disp';out.textContent='当前状态：RESET';};
  };
  /* --- 追踪表 --- */
  window.SIMS.simTrace = function(el){
    const seed=[['Class B CPU 测试（S/待核实）','库 CPU_Test_All（R）','—','TC-CPU-01 上电 PASS','待填'],
      ['Class B ROM 完整性','CRC 注入+比对（R）','512KB 范围','TC-FLASH-03 注入检出','待填'],
      ['洗衣机加热安全（E）','POEG 硬件关断（R）','GTIOC0A/B','TC-POE-01 实测关断','待填']];
    el.innerHTML=`<h4>交互实验 · 需求追踪表编辑器</h4><div class="snote">E｜教学示例。编辑内容自动保存到本浏览器（localStorage），仅练习用。</div>
    <div class="ctrl"><button id="trAdd">+ 增加一行</button><button id="trClr" class="ghost">清空</button></div>
    <div style="overflow-x:auto"><table id="trTable" style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr>${['需求','设计决策','集成参数','验证用例','结果/证据',''].map(h=>`<th style="padding:6px 8px;border:1px solid var(--line);color:var(--sub);text-align:left">${h}</th>`).join('')}</tr></thead><tbody></tbody></table></div>`;
    const tb=el.querySelector('tbody'),KEY='iec_trace_v1';
    let rows;try{rows=JSON.parse(localStorage.getItem(KEY))||seed;}catch(e){rows=seed;}
    const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(rows));}catch(e){}};
    const render=()=>{tb.innerHTML=rows.map((r,ri)=>'<tr>'+r.map((c,ci)=>`<td style="padding:4px;border:1px solid var(--line)"><input value="${(c||'').replace(/"/g,'&quot;')}" data-r="${ri}" data-c="${ci}" style="width:100%;background:transparent;border:none;color:var(--txt);font-size:12px"></td>`).join('')+`<td style="padding:4px;border:1px solid var(--line)"><button class="ghost" data-del="${ri}" style="font-size:11px;padding:2px 8px">删</button></td></tr>`).join('');
      tb.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{rows[+inp.dataset.r][+inp.dataset.c]=inp.value;save();});
      tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);save();render();});};
    el.querySelector('#trAdd').onclick=()=>{rows.push(['','','','','']);save();render();};
    el.querySelector('#trClr').onclick=()=>{if(confirm('清空追踪表？')){rows=[['','','','','']];save();render();}};
    render();
  };
};

</script>
<script>
/* 课程应用：导航/渲染/测验/搜索/进度/术语与来源弹窗 */
(function(){
'use strict';
const CH = window.CHP;
const ORDER = ['ch01','ch02','ch03','ch04','ch05','ch06','ch07','ch08','ch09','ch10','ch11','ch12','ch13','ch14','labA','labB','labC'];
const STAGES = {1:'第一阶段 · 标准基础',2:'第二阶段 · 自检原理',3:'第三阶段 · RA2E1 工程实践',4:'第四阶段 · 验证与综合（含实训）'};
const KEY = 'iec_course_v1';
let cur = localStorage.getItem(KEY+'_cur') || 'ch01';
let state; try{state = JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){state={};}
state.done = state.done||{}; state.quiz = state.quiz||{};
const $ = s=>document.querySelector(s);

/* ===== 侧栏 ===== */
function buildNav(){
  const sb = $('#sidebar'); let html='', lastStage=null;
  ORDER.forEach(id=>{const ch=CH[id];
    if(ch.stage!==lastStage){html+=`<div class="stage-l">${STAGES[ch.stage]}</div>`;lastStage=ch.stage;}
    const done=state.done[id];
    html+=`<div class="nav-u ${id===cur?'active':''} ${done?'done':''}" data-id="${id}"><span class="no">${done?'✓':ch.no}</span>${ch.title}</div>`;});
  sb.innerHTML=html;
  sb.querySelectorAll('.nav-u').forEach(n=>n.onclick=()=>go(n.dataset.id));
}
function go(id){cur=id;localStorage.setItem(KEY+'_cur',id);render();buildNav();
  const a=$(`.nav-u[data-id="${id}"]`); if(a)a.scrollIntoView({block:'nearest'});
  window.scrollTo({top:0});}

/* ===== 术语高亮 ===== */
function glossTerms(html){
  Object.keys(window.GLOSSARY).forEach(k=>{
    const kk=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ \(.+\)$/,'');
    if(html.includes(k))html=html.replace(new RegExp('(?<![\\w<">#;])'+kk+'(?![\\w>])','g'),`<span class="term" data-g="${k}">${kk}</span>`);
  });
  return html;
}

/* ===== 来源卡 ===== */
function tagHtml(tag,src){
  const cls=tag==='S'?'S':tag==='R'?'R':tag==='E'?'E':'T';
  const label=tag==='T'?'待核实':tag+'｜'+(window.SRCMAP[src]?window.SRCMAP[src].t.split('｜')[1]:'教学示例');
  return `<span class="tag tag-${cls}" data-src="${src}">${label}</span>`;
}
function showSrc(e){
  const src=e.target.dataset.src;const m=window.SRCMAP[src];
  const pop=$('#srcPop');
  if(!m){pop.innerHTML=`<h5>E｜教学示例</h5><p>本内容为自行构造的教学材料，不代表 Renesas 官方代码，也不能直接证明产品符合 IEC 60730。</p>`;}
  else{pop.innerHTML=`<h5>${m.t}</h5><dl>
    <dt>来源文档</dt><dd>${m.doc}</dd><dt>版本/编号</dt><dd>${m.ver||'—'}</dd>
    <dt>位置/参考</dt><dd>${m.ref}</dd><dt>适用 MCU</dt><dd>${m.mcu||'—'}</dd>
    <dt>核实状态</dt><dd>${m.verified}</dd><dt>备注</dt><dd>${m.note||'—'}</dd></dl>`;}
  pop.style.display='block';
  const w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=Math.min(e.clientX+12,innerWidth-w-12)+'px';
  pop.style.top=Math.min(e.clientY+12,innerHeight-h-12)+'px';
}

/* ===== 渲染章节 ===== */
function render(){
  const ch=CH[cur];
  const ut=$('#unitTitle'); if(ut)ut.textContent=STAGES[ch.stage]+' · '+ch.no+' '+ch.title;
  let h=`<h1 class="ch"><span class="no">${ch.no}</span> ${ch.title}</h1>`;
  h+=`<div class="ch-lead"><h4>本章导读</h4>
    <p><b>解决什么问题：</b>${ch.lead.goal}</p>
    <p><b>为什么学：</b>${ch.lead.why}</p>
    <p class="dim">前置：${ch.lead.pre}　│　在课程中的位置：${ch.lead.rel}</p>
    <label class="ckm ${state.done[ch.id]?'done':''}"><input type="checkbox" id="chDone" ${state.done[ch.id]?'checked':''}> 本章已完成</label></div>`;
  h+=`<h2 class="sec">核心概念</h2>`;
  (ch.concepts||[]).forEach((c,i)=>{
    h+=`<div class="kp open"><div class="kp-h" data-kp="${i}"><span class="t">${c.t}</span>${tagHtml(c.tag,c.src)}<label class="ckm ${state.kp&&state.kp[cur+i]?'done':''}"><input type="checkbox" class="kpck" data-k="${cur+i}" ${state.kp&&state.kp[cur+i]?'checked':''}>已理解</label><span class="arr">▶</span></div>
      <div class="kp-b"><p class="def">${c.def}</p>${glossTerms(c.body)}</div></div>`;
  });
  (ch.figs||[]).forEach(fk=>{const f=window.FIGURES[fk];
    if(f)h+=`<div class="fig">${f.svg}<div class="cap">${(ch.figcaps&&ch.figcaps[fk])||''}</div></div>`;});
  if(ch.sim){h+=`<div class="sim" id="sim_${ch.sim}"><h4>交互实验加载中…</h4></div>`;}
  if(ch.code)ch.code.forEach(cd=>{
    h+=`<div class="codebox"><div class="chd"><span class="src">${cd.title} · ${cd.src}</span><button class="cp">复制</button></div><pre>${cd.code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre></div>`;});
  if(ch.quiz&&ch.quiz.length){
    h+=`<div class="quiz"><h4>章节测验（${ch.quiz.length} 题）</h4>`;
    ch.quiz.forEach((q,qi)=>{
      h+=`<div class="q" data-q="${qi}"><div class="qt">${qi+1}. ${q.q}</div>`;
      q.opts.forEach((o,oi)=>h+=`<button class="opt" data-o="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`);
      h+=`<div class="exp" id="exp_${qi}"></div></div>`;});
    h+=`</div>`;}
  h+=`<div class="summary"><h4>本章总结</h4><ul>${(ch.summary||[]).map(s=>`<li>${s}</li>`).join('')}</ul><div class="nextch">${ch.next||''}</div></div>`;
  const nextIdx=ORDER.indexOf(cur)+1;
  if(nextIdx<ORDER.length)h+=`<div style="text-align:center;margin-top:20px"><button class="tbtn" id="nextBtn" style="padding:10px 26px">下一单元：${CH[ORDER[nextIdx]].no} ${CH[ORDER[nextIdx]].title} →</button></div>`;
  $('#main').innerHTML=h;
  bind();
  if(ch.sim&&window.SIMS[ch.sim])window.SIMS[ch.sim]($('#sim_'+ch.sim));
}
function bind(){
  const m=$('#main');
  m.querySelectorAll('.kp-h').forEach(h=>h.addEventListener('click',e=>{
    if(e.target.closest('.ckm'))return; h.parentElement.classList.toggle('open');}));
  m.querySelectorAll('#chDone').forEach(c=>c.onchange=()=>{state.done[cur]=c.checked;save();buildNav();updProg();});
  m.querySelectorAll('.kpck').forEach(c=>c.onchange=()=>{state.kp=state.kp||{};state.kp[c.dataset.k]=c.checked;c.closest('.ckm').classList.toggle('done',c.checked);save();updProg();});
  m.querySelectorAll('.tag').forEach(t=>t.onclick=showSrc);
  m.querySelectorAll('.term').forEach(t=>t.onclick=e=>{const pop=$('#glossPop');pop.innerHTML='<b>'+t.dataset.g+'</b><p style="margin-top:6px">'+window.GLOSSARY[t.dataset.g]+'</p>';
    pop.style.display='block';const w=pop.offsetWidth;pop.style.left=Math.min(e.clientX+10,innerWidth-w-10)+'px';pop.style.top=(e.clientY+14)+'px';});
  m.querySelectorAll('.q').forEach(qd=>{
    const qi=+qd.dataset.q, q=CH[cur].quiz[qi];
    qd.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const oi=+b.dataset.o, exp=qd.querySelector('.exp');
      qd.querySelectorAll('.opt').forEach(x=>{x.classList.remove('right','wrong');x.disabled=false;});
      if(oi===q.a){b.classList.add('right');}else{b.classList.add('wrong');qd.querySelectorAll('.opt')[q.a].classList.add('right');}
      exp.innerHTML='<b>'+(oi===q.a?'正确。':'再想想。正确答案：'+String.fromCharCode(65+q.a)+'。')+'</b> '+q.exp+'　<span class="tag tag-'+q.src[0]+'" data-src="'+q.src+'">'+q.src+'</span>';
      exp.classList.add('show');exp.querySelectorAll('.tag').forEach(t=>t.onclick=showSrc);
      if(oi===q.a)state.quiz[cur+qi]=true;save();updProg();
    });
    if(state.quiz[cur+qi]){/*已答对过，标灰*/qd.querySelectorAll('.opt')[q.a].classList.add('right');exp_show(qd,q);}
  });
  function exp_show(qd,q){const exp=qd.querySelector('.exp');exp.innerHTML='<b>已掌握。</b> '+q.exp;exp.classList.add('show');}
  const nb=$('#nextBtn');if(nb)nb.onclick=()=>go(ORDER[ORDER.indexOf(cur)+1]);
  m.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{const pre=b.closest('.codebox').querySelector('pre');
    navigator.clipboard&&navigator.clipboard.writeText(pre.textContent);b.textContent='已复制';setTimeout(()=>b.textContent='复制',1200);});
}

/* ===== 进度 ===== */
function updProg(){
  const total=ORDER.length+Object.keys(CH).reduce((n,id)=>n+CH[id].concepts.length+CH[id].quiz.length,0);
  let d=Object.values(state.done).filter(Boolean).length;
  d+=Object.values(state.kp||{}).filter(Boolean).length;
  d+=Object.values(state.quiz||{}).filter(Boolean).length;
  const p=Math.round(d/total*100);
  $('#progressFill').style.width=p+'%';$('#progressMini').innerHTML='<b>'+p+'%</b> '+d+'/'+total;
  state._p=p;save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ===== 搜索 ===== */
function doSearch(kw){
  const box=$('#searchRes');if(!kw){box.style.display='none';return;}
  kw=kw.toLowerCase();const res=[];
  ORDER.forEach(id=>{const ch=CH[id];
    if((ch.no+' '+ch.title).toLowerCase().includes(kw))res.push({t:ch.no+' '+ch.title,p:'章节',id});
    (ch.concepts||[]).forEach(c=>{if(c.t.toLowerCase().includes(kw))res.push({t:c.t,p:ch.no+' 章 · 概念',id});});
    (ch.quiz||[]).forEach(q=>{if(q.q.toLowerCase().includes(kw))res.push({t:q.q.slice(0,40)+'…',p:ch.no+' 章 · 测验',id});});
  });
  Object.keys(window.GLOSSARY).forEach(k=>{if(k.toLowerCase().includes(kw))res.push({t:k,p:'术语表',id:null});});
  box.innerHTML=res.slice(0,20).map(r=>`<div class="sr"><div class="t">${r.t}</div><div class="p">${r.p}</div></div>`).join('')||'<div class="sr">无结果</div>';
  box.style.display='block';
  box.querySelectorAll('.sr').forEach((el,i)=>{if(res[i]&&res[i].id)el.onclick=()=>{go(res[i].id);box.style.display='none';};else el.onclick=()=>box.style.display='none';});
}

/* ===== 主题 ===== */
function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem(KEY+'_theme',t);$('#themeBtn').textContent=t==='light'?'🌙 深色':'☀️ 浅色';}

/* ===== 启动 ===== */
document.addEventListener('DOMContentLoaded',function(){
  window.initSims();
  buildNav();render();updProg();
  setTheme(localStorage.getItem(KEY+'_theme')||'dark');
  $('#themeBtn').onclick=()=>setTheme(document.body.classList.contains('light')?'dark':'light');
  $('#searchBox').oninput=e=>doSearch(e.target.value.trim());
  $('#searchBox').onblur=()=>setTimeout(()=>$('#searchRes').style.display='none',200);
  $('#searchBox').onfocus=e=>{if(e.target.value.trim())doSearch(e.target.value.trim());};
  document.addEventListener('click',e=>{
    if(!e.target.closest('.tag')&&!e.target.closest('#srcPop'))$('#srcPop').style.display='none';
    if(!e.target.closest('.term')&&!e.target.closest('#glossPop'))$('#glossPop').style.display='none';
  });
});
})();

</script>
